<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>폐유 — 폐식용유 수거</title>
    <meta name="description" content="폐식용유 수거 요청부터 현장 매입까지 — 폐유(payou) 공급자 앱. We pay you for used oil" />
    <meta name="theme-color" content="#1C5A38" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 공유 미리보기(OG) — 추천 랜딩 /ref/:code 포함 전 경로 공통(10-brand.md B6).
         og:image는 크롤러 규격상 절대 URL 필수 → 현 Vercel 프로덕션 도메인. 도메인 확보 시 교체. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="폐유 (payou)" />
    <meta property="og:title" content="폐유 — 폐식용유 수거, 현장 정산" />
    <meta property="og:description" content="폐식용유 수거 요청부터 현장 매입까지. We pay you for used oil" />
    <meta property="og:image" content="https://oilpick-user.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Pretendard 동적 서브셋: 화면에 쓰인 유니코드 범위의 woff2만 내려받는다(풀 가변 폰트 2MB → 보통 수십 KB). -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
