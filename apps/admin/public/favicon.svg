<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Payou 심볼: 딥그린 라운드 사각 + 크림 기름통(P) + 골드 캡. 로고 심볼 재현. -->
  <rect width="64" height="64" rx="15" fill="#1C5A38"/>
  <!-- 기름통 몸통(크림) -->
  <rect x="17" y="20" width="30" height="30" rx="4.5" fill="#F5EFE1"/>
  <!-- 상단 어깨(몸통과 뚜껑 사이 좁은 목) -->
  <rect x="21" y="16.5" width="22" height="6" rx="2.5" fill="#F5EFE1"/>
  <!-- 손잡이(좌상단 루프) -->
  <path d="M24 16.5c0-2.2 1.6-3.8 3.8-3.8h2.6c2.2 0 3.8 1.6 3.8 3.8" fill="none" stroke="#F5EFE1" stroke-width="3" stroke-linecap="round"/>
  <!-- 캡(우상단, 골드) -->
  <rect x="37.5" y="13.5" width="7.5" height="5.5" rx="2" fill="#C99A46"/>
  <!-- P 레터(그린) -->
  <path d="M27 27.5h7.8c3.4 0 5.9 2.4 5.9 5.8s-2.5 5.8-5.9 5.8H31v5.4h-4V27.5Zm4 3.6v4.4h3.3c1.3 0 2.2-.9 2.2-2.2s-.9-2.2-2.2-2.2H31Z" fill="#1C5A38"/>
  <!-- P 볼 안의 골드 점(캡 색 호응) -->
  <circle cx="36.4" cy="33.3" r="1.15" fill="#C99A46"/>
</svg>
