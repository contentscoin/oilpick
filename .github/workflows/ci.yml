name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 ref에 새 푸시가 오면 진행 중 실행을 취소(불필요한 러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 빌드/테스트 결정성용 더미 값(실제 시크릿 아님 — 로컬 Supabase URL + 플레이스홀더 키).
# vite는 VITE_ 접두 process.env를 import.meta.env로 노출하므로 .env 파일 없이도 값이 주입된다.
# VITE_KAKAO_KEY는 의도적으로 미설정 → MapView/주소검색은 폴백 경로로 렌더(정상 동작).
env:
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key

jobs:
  ci:
    name: lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # packageManager 필드(pnpm@10.14.0)를 읽어 해당 pnpm을 설치한다. setup-node의
      # cache:pnpm보다 먼저 와야 store 경로를 찾을 수 있다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
